<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | chatNut</title>
  <link rel="stylesheet" href="signup.css?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .alert-box {
      display: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      margin-bottom: 10px;
    }
    .alert-error {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ef9a9a;
    }
    .alert-success {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
    }
    .btn-disabled {
      opacity: 0.6;
      cursor: not-allowed !important;
    }
  </style>
</head>
<body>
  <section class="signup-hero">
    <h1>Welcome Back</h1>
    <p>Sign in to continue to chatNut</p>

    <div class="signup-wrapper">
      <div id="alertBox" class="alert-box"></div>

      <form id="loginForm" class="signup-form">
        <div class="input-card">
          <label for="username">Username or Email</label>
          <input type="text" id="username" name="username" placeholder="Enter username or email" required autocomplete="username">
        </div>

        <div class="input-card">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
        </div>

        <a href="javascript:void(0)" class="forgot-password-link" onclick="openForgotPasswordModal()">Forgot Password?</a>

        <button type="submit" id="submitBtn" class="signup-btn">Log In</button>
        <p class="login-text">Don't have an account? <a href="signup.html">Sign Up</a></p>
      </form>
    </div>
  </section>

  <div id="forgotPasswordModal" class="fp-modal-overlay">
    <div class="fp-modal-content">
      <div class="fp-modal-header">
        <h3 id="fpModalTitle">Reset Password</h3>
        <button class="fp-close-btn" onclick="closeForgotPasswordModal()">&times;</button>
      </div>

      <div id="fpAlertBox" class="alert-box"></div>

      <form id="fpStep1Form" onsubmit="handleSendResetOtp(event)">
        <p class="otp-meta-info">Enter your registered email address to receive a 6-digit password reset code.</p>

        <div class="input-card" style="margin-top: 10px;">
          <label for="fpEmailInput">Registered Email</label>
          <input type="email" id="fpEmailInput" placeholder="name@example.com" required autocomplete="email">
        </div>

        <button type="submit" id="fpStep1Btn" class="signup-btn" style="margin-top: 14px;">Send Reset Code</button>
      </form>

      <form id="fpStep2Form" style="display: none;" onsubmit="handleResetPassword(event)">
        <div class="otp-meta-info">
          Enter the 6-digit code sent to:
          <strong id="fpTargetEmailDisplay" style="display: block; color: #00a884; margin-top: 2px;">email@example.com</strong>
        </div>

        <div id="fpDevOtpBanner" style="display: none;" class="dev-otp-banner">
          🔑 Reset Code: <strong id="fpDevOtpCode">-</strong>
        </div>

        <div class="input-card">
          <label for="fpOtpInput">6-Digit Reset Code</label>
          <input type="text" id="fpOtpInput" class="otp-display-code" placeholder="------" maxlength="6" pattern="[0-9]{6}" required>
        </div>

        <div class="input-card">
          <label for="fpNewPassword">New Password</label>
          <input type="password" id="fpNewPassword" placeholder="At least 6 characters" required autocomplete="new-password">
        </div>

        <div class="input-card">
          <label for="fpConfirmPassword">Confirm New Password</label>
          <input type="password" id="fpConfirmPassword" placeholder="Re-enter new password" required autocomplete="new-password">
        </div>

        <div class="resend-row">
          <span id="fpCountdownText">Resend code in <strong id="fpTimerVal">60</strong>s</span>
          <button type="button" id="fpResendBtn" class="resend-btn" disabled onclick="handleResendResetOtp()">Resend Code</button>
        </div>

        <button type="submit" id="fpStep2Btn" class="signup-btn" style="margin-top: 10px;">Reset Password</button>
        <button type="button" class="signup-btn btn-secondary" onclick="backToFpStep1()">Change Email</button>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = window.location.protocol === 'file:' ? 'http://localhost:8000' : '';

    // Auto-redirect or switch account
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("switch") === "true" || urlParams.get("logout") === "true") {
      localStorage.removeItem("chatUser");
      localStorage.removeItem("chatFullName");
      localStorage.removeItem("chatEmail");
    } else if (localStorage.getItem("chatUser")) {
      let currentUser = localStorage.getItem("chatUser");
      if (typeof currentUser === "string" && currentUser.trim().startsWith("{")) {
        try {
          const parsed = JSON.parse(currentUser);
          currentUser = parsed.username || parsed.fullname || parsed.email || currentUser;
          localStorage.setItem("chatUser", currentUser);
          if (parsed.fullname) localStorage.setItem("chatFullName", parsed.fullname);
          if (parsed.email) localStorage.setItem("chatEmail", parsed.email);
        } catch (e) {}
      }

      const switchBanner = document.createElement("div");
      switchBanner.style.cssText = "width: 100%; box-sizing: border-box; margin-bottom: 16px; padding: 12px 14px; background: #f0fdf4; border: 1px solid #00a884; border-radius: 12px; font-size: 13px; color: #111b21; display: flex; flex-direction: column; gap: 8px; text-align: left;";
      switchBanner.innerHTML = `
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;">
          <span style="font-size: 13px; color: #374151;">Logged in as <strong style="color: #00a884;">${currentUser}</strong></span>
          <div style="display: flex; gap: 12px; align-items: center;">
            <a href="aftersignup.html" style="color: #00a884; font-weight: 600; text-decoration: none; font-size: 13px;">Continue &rarr;</a>
            <a href="javascript:void(0)" onclick="clearSessionAndStay()" style="color: #ef4444; font-weight: 500; text-decoration: underline; font-size: 13px;">Switch Account</a>
          </div>
        </div>
      `;
      document.getElementById("loginForm")?.prepend(switchBanner);
    }

    function clearSessionAndStay() {
      localStorage.removeItem("chatUser");
      localStorage.removeItem("chatFullName");
      localStorage.removeItem("chatEmail");
      window.location.href = "login.html?switch=true";
    }

    const form = document.getElementById("loginForm");
    const alertBox = document.getElementById("alertBox");
    const submitBtn = document.getElementById("submitBtn");

    function showAlert(msg, isError = true) {
      alertBox.textContent = msg;
      alertBox.className = "alert-box " + (isError ? "alert-error" : "alert-success");
      alertBox.style.display = "block";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.style.display = "none";

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      if (!username || !password) {
        showAlert("Please enter both username/email and password.");
        return;
      }

      submitBtn.classList.add("btn-disabled");
      submitBtn.textContent = "Logging in...";

      try {
        const res = await fetch(`${API_BASE}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.setItem("chatUser", data.username);
          if (data.fullname) localStorage.setItem("chatFullName", data.fullname);
          if (data.email) localStorage.setItem("chatEmail", data.email);

          showAlert("Login successful! Redirecting...", false);
          setTimeout(() => {
            window.location.href = "aftersignup.html";
          }, 600);
        } else {
          showAlert(data.message || "Invalid credentials.");
          submitBtn.classList.remove("btn-disabled");
          submitBtn.textContent = "Log In";
        }
      } catch (err) {
        console.error("Login fetch error:", err);
        showAlert("Failed to connect to server. Please verify the server is running on port 8000.");
        submitBtn.classList.remove("btn-disabled");
        submitBtn.textContent = "Log In";
      }
    });

    // Forgot password modal
    let resetTargetEmail = "";
    let fpTimer = null;
    let fpSecondsLeft = 60;

    const fpModal = document.getElementById("forgotPasswordModal");
    const fpAlertBox = document.getElementById("fpAlertBox");
    const fpStep1Form = document.getElementById("fpStep1Form");
    const fpStep2Form = document.getElementById("fpStep2Form");
    const fpStep1Btn = document.getElementById("fpStep1Btn");
    const fpStep2Btn = document.getElementById("fpStep2Btn");
    const fpResendBtn = document.getElementById("fpResendBtn");
    const fpTimerVal = document.getElementById("fpTimerVal");
    const fpCountdownText = document.getElementById("fpCountdownText");
    const fpDevOtpBanner = document.getElementById("fpDevOtpBanner");
    const fpDevOtpCode = document.getElementById("fpDevOtpCode");

    function showFpAlert(msg, isError = true) {
      fpAlertBox.textContent = msg;
      fpAlertBox.className = "alert-box " + (isError ? "alert-error" : "alert-success");
      fpAlertBox.style.display = "block";
    }

    function openForgotPasswordModal() {
      fpAlertBox.style.display = "none";
      fpStep1Form.style.display = "block";
      fpStep2Form.style.display = "none";
      fpStep1Btn.classList.remove("btn-disabled");
      fpStep1Btn.textContent = "Send Reset Code";
      document.getElementById("fpEmailInput").value = document.getElementById("username").value.trim();
      fpModal.style.display = "flex";
      setTimeout(() => document.getElementById("fpEmailInput").focus(), 100);
    }

    function closeForgotPasswordModal() {
      clearInterval(fpTimer);
      fpModal.style.display = "none";
    }

    fpModal.addEventListener("click", (e) => {
      if (e.target === fpModal) closeForgotPasswordModal();
    });

    // Send reset OTP
    async function handleSendResetOtp(e) {
      e.preventDefault();
      fpAlertBox.style.display = "none";

      const email = document.getElementById("fpEmailInput").value.trim();
      if (!email) {
        showFpAlert("Please enter your registered email address.");
        return;
      }

      fpStep1Btn.classList.add("btn-disabled");
      fpStep1Btn.textContent = "Sending reset code...";

      try {
        const res = await fetch(`${API_BASE}/api/send-reset-otp`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          resetTargetEmail = data.email || email;
          document.getElementById("fpTargetEmailDisplay").textContent = resetTargetEmail;

          fpStep1Form.style.display = "none";
          fpStep2Form.style.display = "block";

          if (data.devOtp) {
            fpDevOtpCode.textContent = data.devOtp;
            fpDevOtpBanner.style.display = "block";
            document.getElementById("fpOtpInput").value = data.devOtp;
          } else {
            fpDevOtpBanner.style.display = "none";
          }

          startFpCountdown();
          document.getElementById("fpOtpInput").focus();
          showFpAlert(data.message || "Reset code sent!", false);
        } else {
          showFpAlert(data.message || "Failed to send reset code.");
          fpStep1Btn.classList.remove("btn-disabled");
          fpStep1Btn.textContent = "Send Reset Code";
        }
      } catch (err) {
        console.error("Forgot password error:", err);
        showFpAlert("Connection error. Please ensure server is running.");
        fpStep1Btn.classList.remove("btn-disabled");
        fpStep1Btn.textContent = "Send Reset Code";
      }
    }

    // Reset password
    async function handleResetPassword(e) {
      e.preventDefault();
      fpAlertBox.style.display = "none";

      const otp = document.getElementById("fpOtpInput").value.trim();
      const newPassword = document.getElementById("fpNewPassword").value;
      const confirmPassword = document.getElementById("fpConfirmPassword").value;

      if (!otp || otp.length < 6) {
        showFpAlert("Please enter the 6-digit code.");
        return;
      }

      if (newPassword.length < 6) {
        showFpAlert("Password must be at least 6 characters long.");
        return;
      }

      if (newPassword !== confirmPassword) {
        showFpAlert("Passwords do not match.");
        return;
      }

      fpStep2Btn.classList.add("btn-disabled");
      fpStep2Btn.textContent = "Resetting password...";

      try {
        const res = await fetch(`${API_BASE}/api/reset-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: resetTargetEmail,
            otp,
            newPassword
          })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          showFpAlert(data.message || "Password reset successfully!", false);
          setTimeout(() => {
            closeForgotPasswordModal();
            showAlert("Password reset successfully! You can now log in.", false);
            document.getElementById("username").value = resetTargetEmail;
            document.getElementById("password").value = "";
            document.getElementById("password").focus();
          }, 1200);
        } else {
          showFpAlert(data.message || "Password reset failed.");
          fpStep2Btn.classList.remove("btn-disabled");
          fpStep2Btn.textContent = "Reset Password";
        }
      } catch (err) {
        console.error("Reset submit error:", err);
        showFpAlert("Connection error. Please try again.");
        fpStep2Btn.classList.remove("btn-disabled");
        fpStep2Btn.textContent = "Reset Password";
      }
    }

    async function handleResendResetOtp() {
      if (fpResendBtn.disabled) return;

      fpResendBtn.disabled = true;
      fpResendBtn.textContent = "Sending...";

      try {
        const res = await fetch(`${API_BASE}/api/send-reset-otp`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: resetTargetEmail })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          showFpAlert("A fresh reset code has been sent!", false);
          if (data.devOtp) {
            fpDevOtpCode.textContent = data.devOtp;
            fpDevOtpBanner.style.display = "block";
            document.getElementById("fpOtpInput").value = data.devOtp;
          }
          startFpCountdown();
        } else {
          showFpAlert(data.message || "Failed to resend code.");
          fpResendBtn.disabled = false;
          fpResendBtn.textContent = "Resend Code";
        }
      } catch (err) {
        showFpAlert("Connection error. Please try again.");
        fpResendBtn.disabled = false;
        fpResendBtn.textContent = "Resend Code";
      }
    }

    function startFpCountdown() {
      clearInterval(fpTimer);
      fpSecondsLeft = 60;
      fpResendBtn.disabled = true;
      fpCountdownText.style.display = "inline";
      fpTimerVal.textContent = fpSecondsLeft;

      fpTimer = setInterval(() => {
        fpSecondsLeft--;
        if (fpSecondsLeft <= 0) {
          clearInterval(fpTimer);
          fpCountdownText.style.display = "none";
          fpResendBtn.disabled = false;
          fpResendBtn.textContent = "Resend Code";
        } else {
          fpTimerVal.textContent = fpSecondsLeft;
        }
      }, 1000);
    }

    function backToFpStep1() {
      clearInterval(fpTimer);
      fpAlertBox.style.display = "none";
      fpStep2Form.style.display = "none";
      fpStep1Form.style.display = "block";
      fpStep1Btn.classList.remove("btn-disabled");
      fpStep1Btn.textContent = "Send Reset Code";
    }
  </script>
</body>
</html>
